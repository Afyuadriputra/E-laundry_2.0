services:
  db:
    image: postgres:17-alpine
    container_name: elaundry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elaundry_db}
      POSTGRES_USER: ${POSTGRES_USER:-elaundry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elaundry_secure_password_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elaundry_user} -d ${POSTGRES_DB:-elaundry_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elaundry-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-elaundry_user}:${POSTGRES_PASSWORD:-elaundry_secure_password_123}@db:5432/${POSTGRES_DB:-elaundry_db}
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-e_laundry_super_secure_random_production_key_32bytes}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-e_laundry_session_secure_random_key_32bytes}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elaundry-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

